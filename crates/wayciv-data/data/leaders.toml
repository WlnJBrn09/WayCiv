# Leaders. Each has an ability (`traits`), an agenda that colors how the AI
# feels about others, banner colors, and lines for diplomacy events:
# first_meet, greeting, declare_war (they declare on you), attacked (you
# declare on them), denounce, denounced, friend (they offer friendship),
# accept_friend, reject_friend, peace_accept, peace_refuse, peace_offer,
# defeat, demand (they ask you for tribute), alliance (they propose one),
# join_war (they ask you to join a war). Missing lines fall back to plain
# ones. `ai` is the computer personality: `aggression` 0-3, a `focus`,
# and the rule its `agenda` is scored by (see `Game::agenda_opinion`).

[[leader]]
id = "LEADER_REAGAN"
name = "Ronald Reagan"
civilization = "CIVILIZATION_AMERICA"
capital = "Washington"
primary_color = [1, 42, 108]
secondary_color = [249, 249, 249]
agenda = { name = "Cold Warrior", description = "Likes civilizations running Democracy. Dislikes civilizations running Communism or Fascism." }
ai = { aggression = 1, focus = "balanced", agenda = "democracy" }
traits = [{ id = "TRAIT_LEADER_PEACE_THROUGH_STRENGTH", name = "Peace Through Strength", description = "Defense buildup, Reaganomics, and the Great Communicator. Declaring friendship with a civilization grants an envoy and 50 Gold.", effects = [
  { kind = "unit_production", military = true, percent = 15 },
  { kind = "combat_in_territory", amount = 5 },
  { kind = "policy_yield", slot = "economic", yield = "gold", amount = 1 },
  { kind = "district_yield", district = "DISTRICT_COMMERCIAL_HUB", yield = "production", amount = 2 },
  { kind = "city_yield", yield = "culture", amount = 2, capital = true },
] }]
[leader.lines]
first_meet = "Well, hello there. I'm Ronald Reagan, and I lead the United States of America. We believe in freedom, and we believe the best is yet to come."
greeting = "It's morning in America, my friend. What can we do for each other today?"
declare_war = "We've tried to keep the peace, but peace comes through strength. You leave us no choice."
attacked = "So it's come to this. History will remember who chose war."
denounce = "I'm calling it what it is: your conduct is a threat to free people everywhere."
denounced = "Words are cheap. We'll judge you by your deeds, and so will the world."
accept_friend = "Trust, but verify. Still, I'm glad to call you a friend."
reject_friend = "Not just yet. Friendship has to be earned, and we're not there."
friend = "Free nations ought to stand together. What do you say we make it official?"
peace_accept = "Peace it is. Let's put this behind us and get back to building."
peace_refuse = "Peace? Not on those terms. We'll talk again when you mean it."
peace_offer = "We've proven our resolve. I'm prepared to sit down and talk peace."
defeat = "We gave it everything we had. America will rise again."

[[leader]]
id = "LEADER_SALADIN"
name = "Saladin"
civilization = "CIVILIZATION_ARABIA"
capital = "Cairo"
primary_color = [21, 108, 48]
secondary_color = [240, 210, 40]
agenda = { name = "Chivalrous Sultan", description = "Respects rulers who share his faith and keep their word. Scorns those who break treaties." }
ai = { aggression = 1, focus = "faith", agenda = "religion" }
traits = [{ id = "TRAIT_LEADER_SALADIN", name = "Sultan of Egypt and Syria", description = "A generous ruler who funds mosques and colleges.", effects = [
  { kind = "district_yield", district = "DISTRICT_HOLY_SITE", yield = "science", amount = 1 },
  { kind = "district_yield", district = "DISTRICT_HOLY_SITE", yield = "culture", amount = 1 },
  { kind = "city_percent", yield = "faith", percent = 10 },
] }]
[leader.lines]
first_meet = "Peace be upon you, traveler. I am Salah ad-Din Yusuf, Sultan of Egypt and Syria."
greeting = "You are welcome in my tent. Speak, and be honest."
declare_war = "You have given me no choice. Let God judge between us on the field."
attacked = "You strike at me? Then I will answer, and without mercy."
denounce = "Your treachery is known to all the faithful."
friend = "An honest friend is worth more than a hundred fortresses. Shall we be friends?"
peace_accept = "Even enemies may share bread. I accept."
defeat = "It is as God wills."

[[leader]]
id = "LEADER_PEDRO"
name = "Pedro II"
civilization = "CIVILIZATION_BRAZIL"
capital = "Rio de Janeiro"
primary_color = [40, 150, 50]
secondary_color = [250, 210, 20]
agenda = { name = "Philosopher King", description = "Admires civilizations with many great people. Dislikes those who neglect learning and the arts." }
ai = { aggression = 0, focus = "culture", agenda = "great_people" }
traits = [{ id = "TRAIT_LEADER_PEDRO", name = "The Scholar Emperor", description = "He corresponded with Pasteur and Darwin and sat in on lectures.", effects = [
  { kind = "great_person_points", class = "scientist", amount = 1 },
  { kind = "great_person_points", class = "writer", amount = 1 },
  { kind = "great_person_points", class = "artist", amount = 1 },
  { kind = "great_person_points", class = "musician", amount = 1 },
] }]
[leader.lines]
first_meet = "Good day! I am Dom Pedro, Emperor of Brazil. Tell me, what are your people reading these days?"
greeting = "Ah, my friend. Have you any news from your academies?"
declare_war = "I take no pleasure in this. But Brazil will defend itself."
attacked = "You choose the sword over reason. A poor choice."
denounce = "A ruler who scorns knowledge is no ruler of mine to admire."
friend = "Let us exchange scholars and books, and call ourselves friends."
peace_accept = "Gladly. There is so much more to learn than to fight."
defeat = "Brazil will remember its emperor kindly, I hope."

[[leader]]
id = "LEADER_QIN"
name = "Qin Shi Huang"
civilization = "CIVILIZATION_CHINA"
capital = "Xi'an"
primary_color = [21, 108, 48]
secondary_color = [240, 230, 200]
agenda = { name = "Builder of Walls", description = "Respects those with great wonders. Holds in contempt those with few." }
ai = { aggression = 1, focus = "culture", agenda = "wonders" }
traits = [{ id = "TRAIT_LEADER_QIN", name = "First Emperor", description = "One script, one coinage, one measure, one empire.", effects = [
  { kind = "wonder_production", percent = 15 },
  { kind = "unit_production", unit = "UNIT_BUILDER", percent = 30 },
] }]
[leader.lines]
first_meet = "You stand before the First Emperor of all under heaven. Kneel, or at least bow."
greeting = "You may speak. Briefly."
declare_war = "Your lands will be measured, mapped, and made part of my empire."
attacked = "Fool. My armies are beyond counting."
denounce = "Your petty kingdom builds nothing worth remembering."
friend = "Even the First Emperor has use for a friend. Accept, and prosper."
peace_accept = "Peace, then. My builders have better things to do."
defeat = "My tomb will outlast your empire."

[[leader]]
id = "LEADER_KUBLAI_KHAN_CHINA"
name = "Kublai Khan"
civilization = "CIVILIZATION_CHINA"
capital = "Beijing"
primary_color = [234, 225, 157]
secondary_color = [120, 0, 1]
agenda = { name = "Silk and Steel", description = "Likes civilizations that trade with him. Dislikes those who close their borders to trade." }
ai = { aggression = 2, focus = "trade", agenda = "trade" }
traits = [{ id = "TRAIT_LEADER_KUBLAI", name = "Great Khan of the Yuan", description = "Paper money and the post road stitched an empire together.", effects = [
  { kind = "trade_capacity", amount = 1 },
  { kind = "trade_yield", routes = "international", yield = "science", amount = 1 },
  { kind = "trade_yield", routes = "international", yield = "culture", amount = 1 },
] }]
[leader.lines]
first_meet = "I am Kublai, Khan of Khans and Emperor of the Yuan. My roads reach from the sea to the steppe."
greeting = "Merchants say good things of you. Is it true?"
declare_war = "The horde rides again. You should have traded with me."
attacked = "You dare? My grandfather conquered half the world."
denounce = "Your roads are empty and your markets closed. Shameful."
friend = "Let our caravans cross freely. We shall both grow rich."
peace_accept = "Good. War is bad for business."
defeat = "The Great Khan falls. Remember Xanadu."

[[leader]]
id = "LEADER_VICTORIA"
name = "Victoria"
civilization = "CIVILIZATION_ENGLAND"
capital = "London"
primary_color = [202, 20, 21]
secondary_color = [249, 249, 249]
agenda = { name = "Empire of the Seas", description = "Admires civilizations on many coasts. Dislikes those who crowd her colonies." }
ai = { aggression = 2, focus = "expansion", agenda = "space" }
traits = [{ id = "TRAIT_LEADER_VICTORIA", name = "Queen and Empress", description = "An empire on which the sun never set.", effects = [
  { kind = "unit_production", domain = "sea", percent = 20 },
  { kind = "unit_production", unit = "UNIT_SETTLER", percent = 15 },
  { kind = "combat", amount = 3, class = "melee" },
] }]
[leader.lines]
first_meet = "We are Victoria, by the grace of God Queen of the United Kingdom and Empress of India."
greeting = "We trust you are keeping well."
declare_war = "We are not amused. The fleet will see to you."
attacked = "You will regret this impertinence."
denounce = "Your conduct is beneath a civilized nation."
friend = "A treaty of friendship would suit us both, we think."
peace_accept = "Very well. Let it be recorded that the Crown was gracious."
defeat = "We bow to history, not to you."

[[unit]]
id = "UNIT_ENGLISH_REDCOAT"
name = "Redcoat"
unique = "LEADER_VICTORIA"
replaces = "UNIT_LINE_INFANTRY"
cost = 360
combat = 70
class = "melee"
tech = "TECH_MILITARY_SCIENCE"
resource = "RESOURCE_NITER"
maintenance = 5
description = "The scarlet-coated regulars of the British Army."

[[leader]]
id = "LEADER_CLEOPATRA"
name = "Cleopatra"
civilization = "CIVILIZATION_EGYPT"
capital = "Alexandria"
primary_color = [1, 79, 81]
secondary_color = [234, 225, 157]
agenda = { name = "Pharaoh's Favor", description = "Courts the strongest military powers. Has no patience for the weak." }
ai = { aggression = 1, focus = "trade", agenda = "military" }
traits = [{ id = "TRAIT_LEADER_CLEOPATRA", name = "Last of the Ptolemies", description = "She held Egypt together with charm, wealth, and Rome's generals.", effects = [
  { kind = "trade_yield", routes = "international", yield = "gold", amount = 3 },
  { kind = "trade_yield", routes = "domestic", yield = "food", amount = 1 },
] }]
[leader.lines]
first_meet = "I am Cleopatra, Pharaoh of the Two Lands. Many have sought my favor. Few deserve it."
greeting = "You return. How interesting."
declare_war = "Weakness invites conquest. You are weak."
attacked = "You overestimate yourself. Rome learned that lesson."
denounce = "You bore me, and you shame yourself."
friend = "A strong friend on the Nile is a gift. Will you accept it?"
peace_accept = "You may have peace. For now."
defeat = "Even Egypt's queen must bow to fate."

[[leader]]
id = "LEADER_CATHERINE_DE_MEDICI"
name = "Catherine de' Medici"
civilization = "CIVILIZATION_FRANCE"
capital = "Paris"
primary_color = [0, 79, 206]
secondary_color = [234, 225, 157]
agenda = { name = "Courtly Intrigue", description = "Likes those who host splendid wonders and festivals. Suspects those who keep secrets from her." }
ai = { aggression = 1, focus = "culture", agenda = "wonders" }
traits = [{ id = "TRAIT_LEADER_CATHERINE", name = "Queen Mother", description = "She governed France through three sons and a court of spies and dancers.", effects = [
  { kind = "district_yield", district = "DISTRICT_THEATER", yield = "culture", amount = 2 },
  { kind = "amenities", amount = 1 },
] }]
[leader.lines]
first_meet = "Welcome to the court of France. I am Catherine. Do enjoy the music; everyone else does."
greeting = "Such a pleasure. What news do you bring me?"
declare_war = "You were warned, in the politest possible way."
attacked = "How crude. France will answer in kind."
denounce = "The whole court is laughing at you."
friend = "Come, dance with France. We will be the envy of the world."
peace_accept = "Peace, then, and a ball to celebrate it."
defeat = "Pity. I had such plans."

[[leader]]
id = "LEADER_BARBAROSSA"
name = "Frederick Barbarossa"
civilization = "CIVILIZATION_GERMANY"
capital = "Aachen"
primary_color = [174, 174, 174]
secondary_color = [24, 24, 24]
agenda = { name = "Imperial Crown", description = "Dislikes civilizations that befriend city-states he wants. Respects strong armies." }
ai = { aggression = 2, focus = "war", agenda = "military" }
traits = [{ id = "TRAIT_LEADER_BARBAROSSA", name = "Holy Roman Emperor", description = "He crossed the Alps again and again to defend his crown.", effects = [
  { kind = "combat", amount = 4 },
  { kind = "unit_production", class = "heavy_cavalry", percent = 25 },
] }]
[leader.lines]
first_meet = "I am Frederick, called Red Beard, Emperor of the Romans and King of the Germans."
greeting = "Greetings. The Empire is listening."
declare_war = "My knights are already in the saddle."
attacked = "You wake the sleeping emperor. Unwise."
denounce = "You have no honor."
friend = "An alliance would serve us both. Do you agree?"
peace_accept = "Peace. The Empire has other battles."
defeat = "I will sleep beneath the mountain until I am needed."

[[leader]]
id = "LEADER_GORGO"
name = "Gorgo"
civilization = "CIVILIZATION_GREECE"
capital = "Sparta"
primary_color = [120, 0, 1]
secondary_color = [116, 163, 243]
agenda = { name = "Spartan Discipline", description = "Respects civilizations that fight bravely. Despises those who make peace too readily." }
ai = { aggression = 3, focus = "war", agenda = "warlike" }
traits = [{ id = "TRAIT_LEADER_GORGO", name = "Queen of Sparta", description = "Only Spartan women give birth to men.", effects = [
  { kind = "combat", amount = 3, class = "anti_cavalry" },
  { kind = "combat", amount = 3, class = "melee" },
  { kind = "great_person_points", class = "general", amount = 1 },
] }]
[leader.lines]
first_meet = "I am Gorgo of Sparta. We speak plainly here."
greeting = "Say what you came to say."
declare_war = "Come back with your shield, or on it."
attacked = "Good. Sparta was getting restless."
denounce = "Coward."
friend = "You have fought well. Sparta will stand beside you."
peace_accept = "Fine. But keep your spears sharp."
defeat = "Tell them in Sparta that we fell obeying our laws."

[[leader]]
id = "LEADER_PERICLES"
name = "Pericles"
civilization = "CIVILIZATION_GREECE"
capital = "Athens"
primary_color = [116, 163, 243]
secondary_color = [249, 249, 249]
agenda = { name = "Golden Age", description = "Likes civilizations with high Culture. Distrusts those who send envoys to his city-states." }
ai = { aggression = 0, focus = "culture", agenda = "culture" }
traits = [{ id = "TRAIT_LEADER_PERICLES", name = "First Citizen", description = "He rebuilt the Acropolis and made Athens the school of Hellas.", effects = [
  { kind = "city_percent", yield = "culture", percent = 10 },
  { kind = "wonder_production", percent = 10 },
] }]
[leader.lines]
first_meet = "Greetings. I am Pericles of Athens, the school of all Greece."
greeting = "Have you seen the new temple on the Acropolis? Magnificent, isn't it?"
declare_war = "Athens fights for its ideals. Prepare yourself."
attacked = "Then the assembly votes for war."
denounce = "You are a barbarian, in thought and deed."
friend = "Let us make a league of friendship, as free peoples should."
peace_accept = "Wise. Let us return to building."
defeat = "Our monuments will speak for us."

[[leader]]
id = "LEADER_HOJO"
name = "Hōjō Tokimune"
civilization = "CIVILIZATION_JAPAN"
capital = "Kyoto"
primary_color = [249, 249, 249]
secondary_color = [180, 0, 20]
agenda = { name = "Way of the Warrior", description = "Respects civilizations with strong armies and high faith. Looks down on the weak." }
ai = { aggression = 2, focus = "faith", agenda = "military" }
traits = [{ id = "TRAIT_LEADER_HOJO", name = "Regent of the Shogunate", description = "He turned back two Mongol invasions; storms did the rest.", effects = [
  { kind = "combat_in_territory", amount = 5 },
  { kind = "district_yield", district = "DISTRICT_HOLY_SITE", yield = "faith", amount = 1 },
] }]
[leader.lines]
first_meet = "I am Hōjō Tokimune, regent of the shogunate. The gods watch over these islands."
greeting = "You are welcome, if you come in peace."
declare_war = "The wind and the sword are with us."
attacked = "Even the Mongols could not take Japan."
denounce = "You have no honor and no discipline."
friend = "You have shown yourself worthy. Let us be friends."
peace_accept = "Peace. Let the storm pass."
defeat = "The cherry blossom falls, as all things must."

[[leader]]
id = "LEADER_MVEMBA"
name = "Mvemba a Nzinga"
civilization = "CIVILIZATION_KONGO"
capital = "Mbanza Kongo"
primary_color = [247, 216, 1]
secondary_color = [202, 20, 21]
agenda = { name = "Seeker of Learning", description = "Likes civilizations that share their faith and learning. Dislikes those who threaten Kongo's trade." }
ai = { aggression = 0, focus = "faith", agenda = "religion" }
traits = [{ id = "TRAIT_LEADER_MVEMBA", name = "Afonso of Kongo", description = "A king who wrote letters to Lisbon and Rome demanding respect.", effects = [
  { kind = "great_person_points", class = "writer", amount = 1 },
  { kind = "great_person_points", class = "merchant", amount = 1 },
  { kind = "city_yield", yield = "faith", amount = 1 },
] }]
[leader.lines]
first_meet = "I am Mvemba a Nzinga, Manikongo of the Kingdom of Kongo. You may call me Afonso."
greeting = "Welcome. What do you bring to Mbanza Kongo?"
declare_war = "You leave me no choice but to defend my people."
attacked = "Kongo will not be taken."
denounce = "You treat others as goods to be sold. I will not stand for it."
friend = "Let us trade in knowledge and craft, as equals."
peace_accept = "Peace is good for every people."
defeat = "Kongo will remember."

[[leader]]
id = "LEADER_HARDRADA"
name = "Harald Hardrada"
civilization = "CIVILIZATION_NORWAY"
capital = "Nidaros"
primary_color = [1, 42, 108]
secondary_color = [202, 20, 21]
agenda = { name = "Last of the Vikings", description = "Respects strong navies. Disdains civilizations with weak fleets." }
ai = { aggression = 3, focus = "war", agenda = "navy" }
traits = [{ id = "TRAIT_LEADER_HARDRADA", name = "Thunder of the North", description = "Varangian guard, king, and raider of every coast.", effects = [
  { kind = "combat", amount = 4, class = "naval_melee" },
  { kind = "combat", amount = 2, class = "melee" },
] }]
[leader.lines]
first_meet = "I am Harald, called Hardrada. I have fought from Constantinople to the North Sea."
greeting = "Ha! You again. Got anything worth plundering?"
declare_war = "The longships are sailing. Lock your doors."
attacked = "Finally, a fight!"
denounce = "You fight like a farmer."
friend = "You are a worthy warrior. Drink with me and be my friend."
peace_accept = "Peace! For now. The sea is wide."
defeat = "A good death. Valhalla awaits."

[[unit]]
id = "UNIT_NORWEGIAN_LONGSHIP"
name = "Longship"
unique = "LEADER_HARDRADA"
replaces = "UNIT_GALLEY"
cost = 60
moves = 4
combat = 35
domain = "sea"
class = "naval_melee"
tech = "TECH_SAILING"
maintenance = 1
description = "A shallow-draft raider that rows up rivers."

[[leader]]
id = "LEADER_TRAJAN"
name = "Trajan"
civilization = "CIVILIZATION_ROME"
capital = "Rome"
primary_color = [109, 0, 205]
secondary_color = [247, 216, 1]
agenda = { name = "Best of Princes", description = "Admires large empires. Dislikes civilizations with few cities." }
ai = { aggression = 2, focus = "expansion", agenda = "cities" }
traits = [{ id = "TRAIT_LEADER_TRAJAN", name = "Optimus Princeps", description = "Under him the empire reached its greatest extent.", effects = [
  { kind = "city_yield", yield = "culture", amount = 1 },
  { kind = "district_production", percent = 10 },
] }]
[leader.lines]
first_meet = "Hail. I am Trajan, Emperor of Rome. The Senate sends its greetings, and so do my legions."
greeting = "Ave. What brings you to Rome?"
declare_war = "Rome expands. You are in the way."
attacked = "You have made an enemy of Rome. Few survive that."
denounce = "You are a small ruler of a small land."
friend = "Rome has room for friends. Will you be one?"
peace_accept = "The gates of Janus may close. Peace."
defeat = "Rome was not built in a day, nor will it fall in one."

[[leader]]
id = "LEADER_PETER_GREAT"
name = "Peter the Great"
civilization = "CIVILIZATION_RUSSIA"
capital = "St. Petersburg"
primary_color = [247, 216, 1]
secondary_color = [24, 24, 24]
agenda = { name = "Window to the West", description = "Likes civilizations ahead of him in science and culture. Dislikes those behind." }
ai = { aggression = 1, focus = "science", agenda = "science" }
traits = [{ id = "TRAIT_LEADER_PETER", name = "The Grand Embassy", description = "He worked incognito in Dutch shipyards to learn how to build a navy.", effects = [
  { kind = "trade_yield", routes = "international", yield = "science", amount = 2 },
  { kind = "trade_yield", routes = "international", yield = "culture", amount = 1 },
] }]
[leader.lines]
first_meet = "I am Peter, Tsar of all the Russias. Show me your shipyards and your schools!"
greeting = "Ah! What have you invented lately?"
declare_war = "Russia will take what it cannot learn."
attacked = "You will freeze in the snows of Russia."
denounce = "You are backward and proud of it. Pathetic."
friend = "Teach me your ways and I will be your friend."
peace_accept = "Peace. Back to work!"
defeat = "My city on the Neva will remember me."

[[leader]]
id = "LEADER_TOMYRIS"
name = "Tomyris"
civilization = "CIVILIZATION_SCYTHIA"
capital = "Pokrovka"
primary_color = [255, 178, 60]
secondary_color = [120, 0, 1]
agenda = { name = "Blood Oath", description = "Respects those who keep their word. Hates those who attack their friends." }
ai = { aggression = 3, focus = "war", agenda = "loyal" }
traits = [{ id = "TRAIT_LEADER_TOMYRIS", name = "Queen of the Massagetae", description = "She defeated Cyrus the Great in battle.", effects = [
  { kind = "combat", amount = 3, class = "light_cavalry" },
  { kind = "combat", amount = 3, class = "ranged" },
  { kind = "unit_xp", amount = 5 },
] }]
[leader.lines]
first_meet = "I am Tomyris, queen of the horse peoples. Cyrus tried to trick me. Ask him how that went."
greeting = "Speak quickly. The horses are restless."
declare_war = "We ride."
attacked = "You will drink your fill of blood."
denounce = "Liar. Snake."
friend = "You keep your word. Ride with me."
peace_accept = "Peace. Do not betray it."
defeat = "The steppe will swallow you too, in time."

[[leader]]
id = "LEADER_PHILIP_II"
name = "Philip II"
civilization = "CIVILIZATION_SPAIN"
capital = "Madrid"
primary_color = [202, 20, 21]
secondary_color = [247, 216, 1]
agenda = { name = "Defender of the Faith", description = "Likes civilizations that share his religion. Detests those who follow another." }
ai = { aggression = 2, focus = "faith", agenda = "religion" }
traits = [{ id = "TRAIT_LEADER_PHILIP", name = "Lord of Two Worlds", description = "He ruled Spain, Portugal, half of Italy, and the Americas.", effects = [
  { kind = "combat", amount = 3 },
  { kind = "unit_production", domain = "sea", percent = 15 },
] }]
[leader.lines]
first_meet = "I am Philip, King of Spain, of Portugal, of the Indies, and defender of the true faith."
greeting = "God keep you. What is your business?"
declare_war = "For God and for Spain!"
attacked = "You will learn what Spain's tercios can do."
denounce = "You are a heretic and a danger to the world."
friend = "Let our crowns be friends, under God."
peace_accept = "Peace. God wills it."
defeat = "The sun sets, even on Spain."

[[leader]]
id = "LEADER_GILGAMESH"
name = "Gilgamesh"
civilization = "CIVILIZATION_SUMERIA"
capital = "Uruk"
primary_color = [1, 42, 108]
secondary_color = [255, 129, 18]
agenda = { name = "Hero's Companion", description = "Likes civilizations who are his friends and fight beside him. Hates those who betray friends." }
ai = { aggression = 2, focus = "war", agenda = "loyal" }
traits = [{ id = "TRAIT_LEADER_GILGAMESH", name = "King of Uruk", description = "Two-thirds god, one-third man, builder of great walls.", effects = [
  { kind = "combat", amount = 2 },
  { kind = "city_yield", yield = "production", amount = 1, capital = true },
  { kind = "city_yield", yield = "science", amount = 1, capital = true },
] }]
[leader.lines]
first_meet = "I am Gilgamesh, King of Uruk of the great walls! Will you be my friend, or my next great adventure?"
greeting = "Friend! Any monsters that need slaying?"
declare_war = "A new adventure begins, and you are the monster."
attacked = "You've made a mighty enemy."
denounce = "You are no friend of mine."
friend = "Every hero needs a companion. Will you be mine?"
peace_accept = "Peace! There are other adventures."
