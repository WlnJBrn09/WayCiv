# World wonders: one per world. `yields` go to the city that builds it;
# `effects` apply across the builder's empire. Wonders without a tech
# unlock in the year the real one was built (roughly).

[[wonder]]
id = "BUILDING_STONEHENGE"
name = "Stonehenge"
cost = 180
tech = "TECH_ASTROLOGY"
yields = { faith = 2 }
description = "A ring of standing stones aligned with the midsummer sunrise."
effects = [{ kind = "great_person_points", class = "prophet", amount = 2 }]

